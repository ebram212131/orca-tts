name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore keystore.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias orca \
            -storepass orca1234 -keypass orca1234 \
            -dname "CN=Orca, OU=Dev, O=Orca, L=Tehran, ST=Iran, C=IR"

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks || true

      - name: Create keystore from secret or generate
        run: |
          if [ ! -f keystore.jks ] || [ ! -s keystore.jks ]; then
            keytool -genkeypair -v \
              -keystore keystore.jks \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias orca \
              -storepass orca1234 -keypass orca1234 \
              -dname "CN=Orca, OU=Dev, O=Orca, L=Tehran, ST=Iran, C=IR"
          fi

      - name: Build Debug APK
        run: |
          chmod +x gradlew 2>/dev/null || true
          ./gradlew assembleDebug --no-daemon 2>&1 || gradle assembleDebug --no-daemon 2>&1

      - name: Sign APK
        run: |
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore keystore.jks \
            -storepass orca1234 \
            app/build/outputs/apk/debug/app-debug.apk orca || true

          ${ANDROID_HOME}/build-tools/$(ls ${ANDROID_HOME}/build-tools/ | tail -1)/zipalign \
            -v 4 \
            app/build/outputs/apk/debug/app-debug.apk \
            app/build/outputs/apk/debug/app-aligned.apk || true

          ${ANDROID_HOME}/build-tools/$(ls ${ANDROID_HOME}/build-tools/ | tail -1)/apksigner sign \
            --ks keystore.jks \
            --ks-pass pass:orca1234 \
            --key-pass pass:orca1234 \
            --ks-key-alias orca \
            app/build/outputs/apk/debug/app-aligned.apk || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: orca-tts-apk
          path: |
            app/build/outputs/apk/debug/app-aligned.apk
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
