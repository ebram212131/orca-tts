name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore keystore.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias orca \
            -storepass orca1234 -keypass orca1234 \
            -dname "CN=Orca, OU=Dev, O=Orca, L=Tehran, ST=Iran, C=IR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build Signed Release APK
        run: |
          gradle assembleRelease \
            -Pandroid.injected.signing.store.file=keystore.jks \
            -Pandroid.injected.signing.store.password=orca1234 \
            -Pandroid.injected.signing.key.alias=orca \
            -Pandroid.injected.signing.key.password=orca1234 \
            --no-daemon

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk orca-tts-server.apk || true
          cp app/build/outputs/apk/debug/app-debug.apk orca-tts-server.apk || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: orca-tts-server
          path: orca-tts-server.apk
